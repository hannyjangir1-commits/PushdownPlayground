# ==========================================
# Render Infrastructure Blueprint (render.yaml)
# https://render.com/docs/blueprint-spec
# ==========================================

services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend Web Service (Free Tier)
  # ----------------------------------------------------
  - type: web
    name: cfg-pda-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ----------------------------------------------------
  # 2. React Vite Frontend Static Site (Free Tier Forever)
  # ----------------------------------------------------
    name: cfg-pda-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cfg-pda-backend
          property: host
